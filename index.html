<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espresso Shot Analyzer</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="header">
            <div class="header-item header-item-left">
                <div id="selectFileButton" class="icon-button">
                    <span class="material-symbols-outlined">upload_file</span>
                    <span>Upload</span>
                </div>

                <input type="file" id="jsonFileInput" accept=".json" title="Select a JSON file to visualize">
                <input type="file" id="compareFileInput" accept=".json" title="Select a comparison JSON file">
                
                <div id="exportButton" class="icon-button">
                    <span class="material-symbols-outlined">photo_camera</span>
                    <span>Save</span>
                </div>
                
                <div id="compareButton" class="icon-button">
                    <span class="material-symbols-outlined">text_compare</span>
                    <span>Compare</span>
                </div>

                <div id="clearCompareButton" class="icon-button">
                    <span class="material-symbols-outlined">restore_page</span>
                    <span>Clear</span>
                </div>
            </div>
            <div class="header-item header-item-center">
                 <h1>
                    <span id="titleIcon" class="material-symbols-outlined">local_cafe</span> Espresso Shot Analyzer
                 </h1>
            </div>
            <div class="header-item header-item-right">
                <div class="switch-wrapper">
                    <span class="material-symbols-outlined dark-mode-icon">dark_mode</span>
                    <label class="switch" for="theme-toggle">
                        <input type="checkbox" id="theme-toggle" title="Toggle light and dark mode">
                        <span class="slider"></span>
                    </label>
                    <span class="material-symbols-outlined light-mode-icon">light_mode</span>
                </div>
            </div>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <div id="drop-area">
            <span class="material-symbols-outlined">file_upload</span>
            <p><a href="#" id="selectFilesLink">Select your files</a> or drag and drop them</p>
        </div>

        <div id="export-wrapper">
            <div id="shotDetails" class="shot-details"></div>

            <div class="content-grid">
                <div id="chartsContainer" class="charts-container">
                     <div id="mainChartWrapper" class="chart-wrapper">
                        <canvas id="mainChart"></canvas>
                    </div>
                    <div id="mainChartLegend" class="legend-container"></div>
                    
                    <div id="temperatureChartWrapper" class="chart-wrapper">
                        <canvas id="temperatureChart"></canvas>
                    </div>
                    <div id="temperatureChartLegend" class="legend-container"></div>
                </div>
                
                <div id="shotVitals"></div>
            </div>
        </div>
        
        <div id="customTooltip"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="script.js?v=2"></script>
</body>
</html>
